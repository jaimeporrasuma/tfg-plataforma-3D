version: '3.8'

services:
  backend:
    build: ./backend
    container_name: tumaqueta_backend
    ports:
      - "4000:4000"
    env_file:
      - ./backend/.env
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: tumaqueta_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
